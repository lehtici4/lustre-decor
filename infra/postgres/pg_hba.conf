# pg_hba.conf do Lustre Decor — carregado via `-c hba_file=` por
# infra/postgres/entrypoint-tls.sh (substitui o gerado pelo initdb).
#
# TYPE      DATABASE  USER  ADDRESS     METHOD

# Socket Unix: só existe DENTRO do container do Postgres (healthcheck
# pg_isready, scripts de init, `docker exec psql`). Mesmo comportamento da
# imagem oficial; ninguém de fora alcança o socket.
local       all       all               trust

# Pela rede (backend, pg_dump do backup): só TLS + senha SCRAM.
hostssl     all       all   0.0.0.0/0   scram-sha-256
hostssl     all       all   ::/0        scram-sha-256

# Qualquer tentativa sem TLS é recusada explicitamente.
hostnossl   all       all   0.0.0.0/0   reject
hostnossl   all       all   ::/0        reject

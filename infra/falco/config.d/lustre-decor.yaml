# Falco — configuração do Lustre Decor (sobrepõe /etc/falco/falco.yaml).
# Instalado em /etc/falco/config.d/ por infra/scripts/install-falco.sh.
# Ver docs/deteccao.md.

# Driver modern eBPF (CO-RE): não precisa de kernel headers, DKMS nem módulo
# de kernel; exige kernel >= 5.8 com BTF (Ubuntu 22.04/24.04 atendem). Falco
# roda no HOST como serviço systemd — nunca em container privilegiado (seria
# incoerente com o modelo de adversário, que trata T1611 como risco central).
engine:
  kind: modern_ebpf

# Só alertas a partir de NOTICE (inclui "Terminal shell in container" da regra
# padrão e todas as regras LustreDecor). INFORMATIONAL/DEBUG ficam de fora.
priority: notice

# JSON, uma linha por alerta — formato que o agente Wazuh lê direto
# (<localfile><log_format>json</log_format>) e decodifica sem regex.
json_output: true
json_include_output_property: true
json_include_tags_property: true

# Arquivo coletado pelo agente Wazuh (etapa 3.5 do plano). keep_alive: abre
# uma vez e mantém — a rotação usa copytruncate (infra/falco/logrotate/falco).
file_output:
  enabled: true
  keep_alive: true
  filename: /var/log/falco/falco.json

# Cópia no syslog/journal: continua visível com `journalctl -u falco` mesmo
# se o arquivo acima for apagado (evidência para o T05).
syslog_output:
  enabled: true

# O unit systemd do pacote já descarta o stdout (StandardOutput=null).
stdout_output:
  enabled: false

# Servidor web embutido (/healthz). O padrão escuta em 0.0.0.0:8765 — era a
# "porta 8765 sem serviço identificado" do pentest (VULN-05, .34 e .50). Só
# localhost: ninguém de fora precisa do healthcheck do sensor.
webserver:
  enabled: true
  listen_address: 127.0.0.1
  listen_port: 8765

# Batimento: um evento "Falco internal: metrics snapshot" a cada 15 min no
# falco.json. O agente Wazuh confere se o arquivo mudou na última hora
# (lustre-common.conf, regra 100230): Falco travado deixa de ser silencioso.
# Em 26/10/2026 o processo ficou vivo mas sem emitir nada por ~75 min.
metrics:
  enabled: true
  interval: 15m
  output_rule: true
  resource_utilization_enabled: true
  state_counters_enabled: false
  kernel_event_counters_enabled: true
  libbpf_stats_enabled: false
  convert_memory_to_mb: true
  include_empty_values: false

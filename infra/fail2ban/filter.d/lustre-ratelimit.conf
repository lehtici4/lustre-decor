# Fail2ban — cliente insistindo depois de já ter sido limitado (HTTP 429).
#
# Pega os dois limitadores de login/MFA:
#   - limit_req do Nginx (upstream=-, a requisição nem chegou ao backend);
#   - ScopedRateThrottle do DRF (upstream=429).
# Mesmo formato/ancoragem de lustre-auth.conf.

[Definition]
failregex = ^<HOST> \[[^\]]*\] 429 upstream=(?:-|429) "POST /api/v1/auth/
ignoreregex =

datepattern = ^[^\[]*\[(%%Y-%%m-%%dT%%H:%%M:%%S%%z)\]

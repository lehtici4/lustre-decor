# Fail2ban — requisições bloqueadas pelo ModSecurity/CRS (SQLi, XSS, path
# traversal, scanners...).
#
# Um 403 com upstream=- foi gerado no próprio waf, sem chegar ao backend: no
# vhost do Lustre Decor só o ModSecurity devolve 403 localmente (a allowlist de
# Host responde 400 e o limit_req responde 429). Um 403 do Django (ex.:
# /auth/me/ sem sessão) vem com upstream=403 e NÃO conta aqui.
#
# Ancorado no IP do começo da linha (ver lustre-auth.conf). A regex não lê a
# mensagem do ModSecurity no error log de propósito: ela carrega o trecho do
# payload do atacante antes do "client:", o que abriria espaço para forjar o
# IP banido.

[Definition]
failregex = ^<HOST> \[[^\]]*\] 403 upstream=- "
ignoreregex =

datepattern = ^[^\[]*\[(%%Y-%%m-%%dT%%H:%%M:%%S%%z)\]

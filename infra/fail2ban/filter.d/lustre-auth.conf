# Fail2ban — falhas de autenticação na loja (senha ou código MFA errados).
#
# Lê o access log dedicado do waf (/var/log/lustre-waf/access.log, formato
# "lustre_f2b" definido em nginx/templates/conf.d/default.conf.template):
#
#   <ip> [<iso8601>] <status> upstream=<status do backend> "<método> <uri>" ...
#
# O IP é o PRIMEIRO campo ($remote_addr, vem da conexão TCP — o cliente não
# controla), e a regex é ancorada no início da linha: nada que o atacante
# mande na URI ou no User-Agent consegue forjar o IP a ser banido.
#
# 401 com upstream=401: quem respondeu foi o Django (credencial inválida em
# /auth/login/ ou código TOTP inválido em /auth/mfa/verify/).

[Definition]
failregex = ^<HOST> \[[^\]]*\] 401 upstream=401 "POST /api/v1/auth/(?:login|mfa/verify)/"
ignoreregex =

datepattern = ^[^\[]*\[(%%Y-%%m-%%dT%%H:%%M:%%S%%z)\]

<ossec_config>
  <!-- Só na DMZ (.34): access log dedicado do waf (formato lustre_f2b). -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/lustre-waf/access.log</location>
  </localfile>

  <syscheck>
    <directories check_all="yes">/var/log/lustre-waf</directories>
  </syscheck>
</ossec_config>

<ossec_config>
  <!--
    Bloco do Lustre Decor para o ossec.conf do AGENTE (as duas VMs). Anexado
    por infra/scripts/install-wazuh-agent.sh entre marcadores; o restante do
    ossec.conf é o padrão do pacote (que no Ubuntu já coleta o journald inteiro:
    sshd, sudo, sssd/AD e o log do backend, que usa o driver journald do Docker).
    __REPO__ é trocado pelo caminho do repositório no host.
  -->
  <!-- Alertas do Falco (json_output, uma linha por alerta) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/falco/falco.json</location>
  </localfile>

  <!-- Bans/unbans do Fail2ban -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/fail2ban.log</location>
  </localfile>

  <syscheck>
    <!-- Configuração dos sensores e do Docker: mudança = alerta imediato (T05/T11) -->
    <directories realtime="yes" check_all="yes">/etc/fail2ban,/etc/falco,/etc/docker</directories>
    <!-- Segredos e PKI do projeto: detecta troca/remoção. report_changes fica
         desligado de propósito: o conteúdo nunca vai para o manager. -->
    <directories realtime="yes" check_all="yes" report_changes="no">__REPO__/secrets</directories>
    <!-- Logs dos sensores e dumps do banco: varredura agendada (mudam o tempo
         todo; apagamento/truncamento em tempo real é papel do Falco) -->
    <directories check_all="yes">/var/log/falco,/var/backups/lustre-decor</directories>
  </syscheck>
</ossec_config>

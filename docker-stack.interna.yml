# Perfil "interna" (rede interna, VM 192.168.9.50 — ep138-pucpr): backend +
# postgres, formato Swarm (docker stack deploy) — não
# docker compose. Contraparte de docker-compose.dmz.yml, que roda o waf
# sozinho na VM da DMZ (192.168.9.34 — ep137-pucpr).
#
# Diferenças reais de rodar em Swarm em vez de Compose direto, pra não
# surpreender ninguém:
#   - Swarm não builda imagem (sem suporte a `build:` em `docker stack
#     deploy`). A imagem vem do GHCR (ghcr.io/lehtici4/lustre-decor-backend);
#     antes do deploy: `docker login ghcr.io` e `docker pull` da tag.
#   - `depends_on` não existe em Swarm — não está neste arquivo de propósito.
#     Quem substitui é o `deploy.restart_policy` de cada serviço: se o
#     backend subir antes do Postgres estar pronto, o `migrate` do
#     entrypoint-production.sh falha, o container sai, e o Swarm reinicia
#     sozinho até dar certo.
#   - Secrets vêm do Swarm (`external: true`), não de arquivo local — ver
#     comentário no bloco `secrets:` no fim deste arquivo.
#
# Uso (na VM interna, depois de `docker swarm init` e dos `docker secret
# create` listados no fim deste arquivo):
#   docker pull ghcr.io/lehtici4/lustre-decor-backend:<tag abaixo>
#   docker stack deploy --with-registry-auth -c docker-stack.interna.yml lustre_decor
#
# TLS em todos os saltos: o waf da DMZ fala com o backend em HTTPS com
# autenticação mútua (mTLS), e o backend fala com o Postgres em TLS com
# verify-full. Certificados da CA interna: infra/scripts/generate-internal-pki.sh.
#
# Tag versionada, nunca `latest`: o deploy precisa ser reprodutível e ter um
# ponto de rollback conhecido (tag anterior: etapa2; antes dela: pre-etapa2).

services:
  backend:
    image: ghcr.io/lehtici4/lustre-decor-backend:etapa2-tls
    init: true
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.production
      # Fixo, não via ${VAR:-default}: testando este arquivo localmente, um
      # .env com valor de outro perfil (dev) vazou pra cá silenciosamente —
      # justo o tipo de erro "quebra sem avisar" que estamos tentando evitar
      # (ver README, "Publicando na rede do laboratório"). Este arquivo é
      # dedicado a esta VM, então trava os três valores direto.
      #
      # 192.168.9.34: é o Host que chega aqui de verdade — o waf da DMZ
      # repassa o cabeçalho Host original do navegador sem alterar (ver
      # nginx/proxy_params.conf), e o navegador conecta em 192.168.9.34, não
      # no IP do backend. 192.168.9.50 incluído à parte para acesso direto
      # (diagnóstico, sem passar pelo waf).
      DJANGO_ALLOWED_HOSTS: "192.168.9.34,192.168.9.50,localhost,127.0.0.1,backend"
      # O navegador do usuário final só conhece 192.168.9.34 (a DMZ) — nunca
      # o IP do backend na rede interna.
      DJANGO_CORS_ALLOWED_ORIGINS: "https://192.168.9.34"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://192.168.9.34"
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
      # 0 enquanto o certificado for autoassinado/CA interna (ver
      # docker-compose.dmz.yml) — HSTS com certificado não confiável trava o
      # "prosseguir mesmo assim" do navegador.
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      # MFA (TOTP) obrigatório no login da loja para todas as contas, exceto
      # as listadas aqui (nome de usuário). Só a conta de avaliação exigida
      # pelo professor fica liberada — não há serviço de e-mail no lab, então
      # a recuperação é por códigos de backup. Ver docs/authentication.md.
      MFA_EXEMPT_USERS: "teste@pucparana.com"
      POSTGRES_DB: ${POSTGRES_DB:-lustre_decor}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      # Papel de execução normal do backend: só DML (sem DDL). Ver infra/postgres/init-app-role.sh.
      POSTGRES_USER: ${POSTGRES_RUNTIME_USER:-lustre_app_runtime}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_runtime_password
      # Papel dono do banco, usado só para `migrate` (precisa de DDL) — ver docker/entrypoint-production.sh.
      POSTGRES_MIGRATION_USER: ${POSTGRES_USER:-lustre_app}
      POSTGRES_MIGRATION_PASSWORD_FILE: /run/secrets/postgres_password
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DJANGO_ADMINS: ${DJANGO_ADMINS:-}
      # Sprint 2: "true" troca o login para OIDC + Keycloak (ver
      # backend/config/settings/auth.py e docs/authentication.md).
      ENABLE_OIDC: "false"
      # HTTPS com mTLS no Gunicorn (docker/gunicorn.conf.py): só aceita
      # cliente com certificado da CA interna — o waf da DMZ.
      BACKEND_TLS_CERT_FILE: /run/secrets/backend_tls_cert
      BACKEND_TLS_KEY_FILE: /run/secrets/backend_tls_key
      BACKEND_TLS_CA_FILE: /run/secrets/internal_ca_cert
      # Postgres em TLS validando certificado e nome "postgres" (SAN).
      POSTGRES_SSLMODE: verify-full
      POSTGRES_SSLROOTCERT: /run/secrets/internal_ca_cert
    # Modo host: alcançável em 192.168.9.50:8000 a partir da DMZ via pfSense
    # (em HTTPS com mTLS — sem o certificado do waf, a conexão é recusada),
    # sem passar pela routing mesh do Swarm (que não preserva IP de origem e
    # adicionaria um salto de LB desnecessário pra um serviço de réplica
    # única).
    ports:
      - target: 8000
        published: 8000
        mode: host
    secrets:
      - django_secret_key
      - postgres_password
      - postgres_runtime_password
      - internal_ca_cert
      - backend_tls_cert
      # Chave privada: só o usuário do backend (10001) lê. O Swarm aplica
      # uid/gid/mode nos secrets (o Compose, não).
      - source: backend_tls_key
        target: backend_tls_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - application_net
      - database_net
    read_only: true
    volumes:
      # /tmp em volume nomeado (NÃO tmpfs): mesmo problema do staticfiles — o
      # Swarm não aplica o 1777 no tmpfs, o /tmp nasce root:root 755 e o Python
      # (tempfile) falha com "No usable temporary directory". O volume novo
      # herda 1777 do /tmp da imagem.
      - tmp_data:/tmp
      # /app/staticfiles em volume nomeado (NÃO tmpfs): o Swarm ignorou o
      # `mode: 01777` do tmpfs e o mount nasceu root:root 755, então o
      # collectstatic (usuário 10001) tomava PermissionError em
      # /app/staticfiles/admin. Um volume nomeado novo copia dono e conteúdo
      # do diretório da imagem (criado com chown app:app no Dockerfile,
      # estágio production), então fica gravável sem depender do suporte a
      # opções de tmpfs do Swarm. O collectstatic roda de novo a cada início
      # (idempotente), então persistir não faz mal.
      - staticfiles_data:/app/staticfiles
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # HTTPS + certificado de cliente (mTLS) — ver backend/docker/healthcheck.py.
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      restart_policy:
        # any (não on-failure): container que para "limpo" (exit 0) — como
        # na atualização do docker-ce de 22/09 — também é religado.
        condition: any

  postgres:
    image: postgres:17.6-alpine3.22
    # TLS obrigatório: o wrapper prepara certificado/chave com as permissões
    # que o Postgres exige e liga ssl + pg_hba.conf só-hostssl.
    entrypoint: ["sh", "/usr/local/bin/entrypoint-tls.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lustre_decor}
      POSTGRES_USER: ${POSTGRES_USER:-lustre_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro
      - ./infra/postgres/entrypoint-tls.sh:/usr/local/bin/entrypoint-tls.sh:ro
      - ./infra/postgres/pg_hba.conf:/etc/lustre-postgres/pg_hba.conf:ro
    secrets:
      - postgres_password
      - postgres_runtime_password
      - postgres_tls_cert
      - source: postgres_tls_key
        target: postgres_tls_key
        mode: 0400
    networks:
      - database_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      restart_policy:
        # any (não on-failure): container que para "limpo" (exit 0) — como
        # na atualização do docker-ce de 22/09 — também é religado.
        condition: any

networks:
  application_net:
    driver: overlay
  database_net:
    driver: overlay
    internal: true

volumes:
  postgres_data:
  staticfiles_data:
  tmp_data:

secrets:
  # external: true = já criado no Swarm, não um arquivo local (diferente de
  # docker-compose.prod.yml). Criar uma vez, antes do primeiro deploy:
  #   docker secret create django_secret_key ./secrets/django_secret_key.txt
  #   docker secret create postgres_password ./secrets/postgres_password.txt
  #   docker secret create postgres_runtime_password ./secrets/postgres_runtime_password.txt
  # (os arquivos de origem podem ser gerados com ./infra/scripts/init-secrets.sh,
  # igual no perfil local — só a entrega ao container que muda.)
  #
  # TLS interno (gerados por ./infra/scripts/generate-internal-pki.sh):
  #   docker secret create internal_ca_cert  ./secrets/pki/ca.crt
  #   docker secret create backend_tls_cert  ./secrets/pki/backend.crt
  #   docker secret create backend_tls_key   ./secrets/pki/backend.key
  #   docker secret create postgres_tls_cert ./secrets/pki/postgres.crt
  #   docker secret create postgres_tls_key  ./secrets/pki/postgres.key
  # Secrets do Swarm são imutáveis: para renovar, criar com nome novo (ex.:
  # backend_tls_cert_v2) e trocar a referência aqui.
  django_secret_key:
    external: true
  postgres_password:
    external: true
  postgres_runtime_password:
    external: true
  internal_ca_cert:
    external: true
  backend_tls_cert:
    external: true
  backend_tls_key:
    external: true
  postgres_tls_cert:
    external: true
  postgres_tls_key:
    external: true

# Falso positivo revisado: só se chega aqui depois que `if ($host_allowed = 0)`
# em default.conf já rejeitou qualquer Host fora da allowlist explícita.
proxy_set_header Host $http_host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

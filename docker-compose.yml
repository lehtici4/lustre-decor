name: ${COMPOSE_PROJECT_NAME:-lustre_decor}

services:
  frontend:
    build:
      context: ./frontend
      target: development
    init: true
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - application_net
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: development
    init: true
    environment:
      APP_ENV: ${APP_ENV:-development}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-backend,localhost,127.0.0.1}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      POSTGRES_DB: ${POSTGRES_DB:-lustre_decor}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      # Papel de execução normal do backend: só DML (sem DDL). Ver infra/postgres/init-app-role.sh.
      POSTGRES_USER: ${POSTGRES_RUNTIME_USER:-lustre_app_runtime}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_runtime_password
      # Papel dono do banco, usado só para `migrate` (precisa de DDL) — ver docker/entrypoint.sh.
      POSTGRES_MIGRATION_USER: ${POSTGRES_USER:-lustre_app}
      POSTGRES_MIGRATION_PASSWORD_FILE: /run/secrets/postgres_password
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Alertas de segurança (força bruta bloqueada, acesso a objeto de outro
      # usuário) via e-mail para o Mailpit local — ver docs/security.md.
      # DJANGO_ADMINS vazio por padrão: sem isso configurado no seu .env,
      # os alertas simplesmente não são enviados (não quebra nada).
      DJANGO_ADMINS: ${DJANGO_ADMINS:-}
    command: ["./docker/entrypoint.sh"]
    volumes:
      - ./backend:/app
    secrets:
      - django_secret_key
      - postgres_password
      - postgres_runtime_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application_net
      - database_net
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - application_net
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lustre_decor}
      POSTGRES_USER: ${POSTGRES_USER:-lustre_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/init-app-role.sh:ro
    secrets:
      - postgres_password
      - postgres_runtime_password
    networks:
      - database_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  application_net:
    driver: bridge
  database_net:
    driver: bridge
    internal: true

volumes:
  frontend_node_modules:
  postgres_data:

secrets:
  django_secret_key:
    file: ./secrets/django_secret_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_runtime_password:
    file: ./secrets/postgres_runtime_password.txt

